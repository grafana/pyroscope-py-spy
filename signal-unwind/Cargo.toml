[package]
name = "signal-unwind"
version = "0.1.0"
description = "Walks the CPython 3.11 to 3.14 frame chain from a signal handler into a signal-ringbuffer record"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.98"
publish = false

[dependencies]
kindasafe = "0.1.1"
kindasafe_init = "0.1.1"
libc = { version = "0.2", default-features = false }
signal-ringbuffer = { path = "../signal-ringbuffer" }

[dev-dependencies]
pyo3 = { version = "0.30", features = ["auto-initialize"] }
signal-timer = { path = "../signal-timer" }
